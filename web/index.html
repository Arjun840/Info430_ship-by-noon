<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ski Route Tracker</title>
  <style>
    :root {
      --bg: #eef4f9;
      --card: #ffffff;
      --ink: #1d2a36;
      --muted: #5f6f7e;
      --line: #d7e1ea;
      --accent: #1f6fb2;
      --green: #2e8b57;
      --blue: #1f6fb2;
      --black: #1d2a36;
      --new: #fff6d9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      background: linear-gradient(135deg, #1f6fb2, #4fa3d9);
      color: white;
      padding: 28px 16px;
    }
    header h1 { margin: 0 0 4px; font-size: 1.8rem; }
    header p { margin: 0; opacity: 0.9; }
    main { max-width: 900px; margin: 0 auto; padding: 20px 16px 40px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .card h2 { margin: 0 0 12px; font-size: 1.1rem; }
    label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 4px; }
    select, input, textarea, button {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    select, input, textarea { width: 100%; background: white; }
    button {
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.1); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .row > div { flex: 1 1 180px; }
    .summary { color: var(--muted); margin: 0 0 12px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    tr.untried { background: var(--new); }
    .badge { font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #f2c94c; color: #4a3b00; }
    .diff { white-space: nowrap; font-weight: 600; }
    .diff.green { color: var(--green); }
    .diff.blue { color: var(--blue); }
    .diff.black { color: var(--black); }
    .stars { color: #e0a800; letter-spacing: 2px; white-space: nowrap; }
    .muted { color: var(--muted); }
    #message { margin: 10px 0 0; color: var(--green); font-weight: 600; min-height: 1.2em; }
    #message.error, .summary.error { color: #c0392b; }
  </style>
</head>
<body>
  <header>
    <h1>⛷️ Ski Route Tracker</h1>
    <p>Pick a resort, see which routes you've skied, and find new ones to try.</p>
  </header>

  <main>
    <section class="card">
      <h2>1. Pick a resort</h2>
      <div class="row">
        <div>
          <label for="skier">I am</label>
          <select id="skier"></select>
        </div>
        <div>
          <label for="resort">Resort</label>
          <select id="resort"></select>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>2. My routes</h2>
      <p class="summary" id="summary"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Route</th>
              <th>Lift</th>
              <th>Difficulty</th>
              <th>My rating</th>
              <th>My comment</th>
            </tr>
          </thead>
          <tbody id="results"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>3. Rate a route I skied</h2>
      <form id="rate-form">
        <div class="row">
          <div>
            <label for="route">Route</label>
            <select id="route"></select>
          </div>
          <div style="flex: 0 1 120px">
            <label for="rating">Rating (1–5)</label>
            <select id="rating">
              <option>5</option><option>4</option><option>3</option><option>2</option><option>1</option>
            </select>
          </div>
        </div>
        <div style="margin-top: 12px">
          <label for="comment">Comment (optional)</label>
          <textarea id="comment" rows="2" maxlength="500" placeholder="Great groomer in the morning, icy by 2pm"></textarea>
        </div>
        <div style="margin-top: 12px">
          <button type="submit">Save rating</button>
        </div>
        <p id="message"></p>
      </form>
    </section>
  </main>

  <script>
    // The page only talks to this app's own /api routes. The server runs the SQL.
    const symbols = { Green: '● Green', Blue: '■ Blue', Black: '◆ Black', 'Double Black': '◆◆ Double Black' };

    async function getJson(url, options) {
      const res = await fetch(url, options);
      let data;
      try {
        data = await res.json();
      } catch {
        // The server sent back HTML instead of JSON, e.g. "Cannot GET /api/..." from an old server.
        throw new Error(`${url} did not return data (HTTP ${res.status}). Restart the server: Ctrl+C, then npm start`);
      }
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function fillSelect(select, rows, valueKey, textKey) {
      select.replaceChildren();
      for (const row of rows) {
        const opt = document.createElement('option');
        opt.value = row[valueKey];
        opt.textContent = row[textKey];
        select.appendChild(opt);
      }
    }

    async function loadRoutes() {
      const skierId = document.getElementById('skier').value;
      const resortId = document.getElementById('resort').value;
      const params = new URLSearchParams({ skierId, resortId });
      try {
        const routes = await getJson('/api/routes?' + params);
        showRoutes(routes);
      } catch (err) {
        const summary = document.getElementById('summary');
        summary.className = 'summary error';
        summary.textContent = 'Could not load routes: ' + err.message;
      }
    }

    function stars(n) {
      return '★'.repeat(n) + '☆'.repeat(5 - n);
    }

    // Build table rows with textContent (not innerHTML) so user comments can't inject HTML.
    function showRoutes(routes) {
      const tbody = document.getElementById('results');
      tbody.replaceChildren();

      // The SQL already puts routes you haven't tried first.
      for (const r of routes) {
        const tr = document.createElement('tr');
        if (r.rating === null) tr.className = 'untried';

        const name = document.createElement('td');
        name.textContent = r.routeName + ' ';
        if (r.rating === null) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = 'Not tried yet';
          name.appendChild(badge);
        }

        const lift = document.createElement('td');
        lift.textContent = r.liftName;

        const diff = document.createElement('td');
        diff.className = 'diff ' + (r.difficulty === 'Green' ? 'green' : r.difficulty === 'Blue' ? 'blue' : 'black');
        diff.textContent = symbols[r.difficulty] || r.difficulty;

        const rating = document.createElement('td');
        if (r.rating === null) {
          rating.className = 'muted';
          rating.textContent = '—';
        } else {
          rating.className = 'stars';
          rating.textContent = stars(r.rating);
        }

        const comment = document.createElement('td');
        comment.textContent = r.comment || '';

        tr.append(name, lift, diff, rating, comment);
        tbody.appendChild(tr);
      }

      const tried = routes.filter(r => r.rating !== null).length;
      const summary = document.getElementById('summary');
      summary.className = 'summary';
      summary.textContent =
        `You've skied ${tried} of ${routes.length} routes here. ${routes.length - tried} left to explore.`;

      // Fill the "Route" dropdown in the rating form, keeping the current choice if possible.
      const routeSelect = document.getElementById('route');
      const previous = routeSelect.value;
      fillSelect(routeSelect, routes, 'routeId', 'routeName');
      if (routes.some(r => String(r.routeId) === previous)) routeSelect.value = previous;
    }

    document.getElementById('skier').addEventListener('change', loadRoutes);
    document.getElementById('resort').addEventListener('change', loadRoutes);

    document.getElementById('rate-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = document.getElementById('message');
      const routeSelect = document.getElementById('route');
      const body = {
        skierId: document.getElementById('skier').value,
        routeId: routeSelect.value,
        stars: Number(document.getElementById('rating').value),
        comment: document.getElementById('comment').value
      };
      try {
        await getJson('/api/ratings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const routeName = routeSelect.options[routeSelect.selectedIndex].textContent;
        message.className = '';
        message.textContent = `Saved: ${routeName} (${body.stars}/5).`;
        document.getElementById('comment').value = '';
        await loadRoutes();
      } catch (err) {
        message.className = 'error';
        message.textContent = 'Not saved: ' + err.message;
      }
    });

    // On page load: fill the dropdowns from the database, then show routes.
    (async () => {
      try {
        const [skiers, resorts] = await Promise.all([getJson('/api/skiers'), getJson('/api/resorts')]);
        fillSelect(document.getElementById('skier'), skiers, 'skierId', 'skierName');
        fillSelect(document.getElementById('resort'), resorts, 'resortId', 'resortName');
        await loadRoutes();
      } catch (err) {
        const summary = document.getElementById('summary');
        summary.className = 'summary error';
        summary.textContent = 'Could not reach the database: ' + err.message + ' (Are you on UW Wi-Fi or Husky OnNet?)';
      }
    })();
  </script>
</body>
</html>
